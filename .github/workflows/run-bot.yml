name: Run EPUB Translation Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: epub-translate-bot
  cancel-in-progress: true

jobs:

  run:

    runs-on: ubuntu-latest

    timeout-minutes: 355

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Start bot
        run: |
          python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
